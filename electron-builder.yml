appId: com.deepseekharness.desktop
productName: DeepSeek Harness Desktop
artifactName: DeepSeek-Harness-Desktop-${version}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
asar: true
# dsh 作为子进程入口被 spawn 执行，解包到 app.asar.unpacked 避免 asar 内脚本
# 执行的边界问题（__dirname 定位、子进程、原生模块等）。其余依赖仍走 asar。
asarUnpack:
  - node_modules/@deepseek-ai/dsh/**/*
files:
  - src/**/*
  - settings/**/*
  - usage/**/*
  - assets/**
  - settings-preload.cjs
  - main-preload.cjs
  - usage-inject.cjs
  - usage-preload.cjs
  - package.json
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
win:
  icon: assets/icon.ico
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
