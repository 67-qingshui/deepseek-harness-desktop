<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用量统计</title>
  <link rel="stylesheet" href="usage.css" />
</head>
<body>
  <div class="titlebar-drag"></div>
  <main class="container">
    <header class="header">
      <h1>Token 用量统计</h1>
      <p class="subtitle">基于 DeepSeek 官方 usage 字段计费规则统计，估算费用仅供参考</p>
    </header>

    <!-- 汇总卡片 -->
    <section class="summary-grid" id="summary-grid">
      <div class="stat-card">
        <div class="stat-label">调用次数</div>
        <div class="stat-value" id="stat-calls">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总输入 Tokens</div>
        <div class="stat-value" id="stat-prompt">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">总输出 Tokens</div>
        <div class="stat-value" id="stat-completion">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">缓存命中 Tokens</div>
        <div class="stat-value" id="stat-cache-hit">0</div>
        <div class="stat-sub" id="stat-cache-rate">命中率 0%</div>
      </div>
      <div class="stat-card stat-card-cost">
        <div class="stat-label">估算费用</div>
        <div class="stat-value" id="stat-cost">¥0.00</div>
        <div class="stat-sub">以官方账单为准</div>
      </div>
    </section>

    <!-- 图表区 -->
    <section class="chart-section">
      <div class="chart-header">
        <h2>用量趋势</h2>
        <span class="chart-hint">近 50 次调用</span>
      </div>
      <canvas id="chart-trend" width="820" height="220"></canvas>
    </section>

    <section class="chart-section">
      <div class="chart-header">
        <h2>输入 vs 输出</h2>
      </div>
      <canvas id="chart-bar" width="820" height="160"></canvas>
    </section>

    <!-- 明细列表 -->
    <section class="chart-section">
      <div class="chart-header">
        <h2>最近调用明细</h2>
        <button class="btn btn-ghost" id="btn-clear">清空记录</button>
      </div>
      <div class="record-list" id="record-list">
        <div class="empty">暂无用量数据，进行 API 调用后将自动统计</div>
      </div>
    </section>

    <footer class="footer">
      <span class="status">计费规则参考 <a href="#" id="link-pricing">DeepSeek 官方定价</a></span>
    </footer>
  </main>
  <script src="usage.js"></script>
</body>
</html>
